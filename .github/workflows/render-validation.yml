name: Render deployment validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "App.jsx"
      - "api/**"
      - "main.jsx"
      - "package.json"
      - "render.yaml"
      - "server.js"
      - "vite.config.js"
      - ".github/workflows/render-validation.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Validate server syntax
        run: |
          node --check server.js
          node --check api/generate-quiz.js
      - name: Build Vite app
        run: npm run build
